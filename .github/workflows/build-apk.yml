name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Rebuild web assets from exact v4 source
        shell: bash
        run: |
          mkdir -p app/src/main/assets/www
          cat web/chunk-* > app/src/main/assets/www/index.html
          cp web/manifest.json app/src/main/assets/www/manifest.json
          cp web/sw.js app/src/main/assets/www/sw.js

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK with Android apksigner
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          unzip -l "$APK" | grep -E 'AndroidManifest.xml|classes.dex|assets/www/index.html'
          test -s "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Moi-Finansy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
