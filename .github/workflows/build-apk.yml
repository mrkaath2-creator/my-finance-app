name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses and install SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Rebuild web assets from exact v4 source
        shell: bash
        run: |
          mkdir -p app/src/main/assets/www
          cat web/chunk-* > app/src/main/assets/www/index.html
          cp web/manifest.json app/src/main/assets/www/manifest.json
          cp web/sw.js app/src/main/assets/www/sw.js
          cp web/manual.js app/src/main/assets/www/manual.js
          test -s app/src/main/assets/www/manual.js
          grep -q "function initManual" app/src/main/assets/www/manual.js

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK with Android apksigner
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -l "$APK" | grep -E 'AndroidManifest.xml|classes.dex|assets/www/index.html'
          test -s "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Moi-Finansy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
